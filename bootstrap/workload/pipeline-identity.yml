AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pipeline identity for one workload account: the GitHub OIDC provider, a
  CloudFormation service role, separate plan and deploy roles for GitHub
  Actions, a bucket for packaged code, and the permissions boundary that every
  role a stack creates must carry. Deployed by a human administrator, never by
  the pipeline itself.

Parameters:
  OrgPrefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,12}$'
    Description: Short lowercase prefix used in every name.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Which environment this account hosts.
  GitHubSubjectPrefix:
    Type: String
    AllowedPattern: '^repo:[A-Za-z0-9-]+@[0-9]+/[A-Za-z0-9._-]+@[0-9]+$'
    Description: >-
      Repository part of the OIDC subject claim, in the form GitHub uses for
      new repositories, for example repo:octocat@1234567/my-repo@987654321.
      Wildcards are rejected.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Packaged code, such as Lambda zips, uploaded by scripts/cfn-change.sh.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${OrgPrefix}-${Environment}-artifacts-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # shortcut: packages expire after 90 days, so rolling a stack back to
          # code older than that fails; raise the number if you ever need to.
          - Id: expire-old-packages
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # The most any role created by a stack can ever do: everything except changing
  # identities, the organization or the account. CloudFormation may only create
  # roles that carry this boundary.
  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${OrgPrefix}-workload-boundary-${Environment}'
      Description: Permissions boundary for every role that a pipeline-deployed stack creates.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowWorkloadActions
            Effect: Allow
            Action: '*'
            Resource: '*'
          - Sid: DenyIdentityAndAccountChanges
            Effect: Deny
            Action:
              - 'iam:*'
              - 'organizations:*'
              - 'account:*'
              - 'sso:*'
              - 'sso-directory:*'
              - 'identitystore:*'
            Resource: '*'

  # Assumed by the CloudFormation service only. This role, not the GitHub roles,
  # holds the permission to create resources. Widen it deliberately, one service
  # at a time, as projects need them.
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${OrgPrefix}-cfn-service-${Environment}'
      Description: Creates the resources defined in pipeline-deployed stacks.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: stack-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BucketsForThisEnvironment
                Effect: Allow
                Action: 's3:*'
                Resource: !Sub 'arn:aws:s3:::${OrgPrefix}-${Environment}-*'
              - Sid: CreateRolesOnlyWithTheBoundary
                Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:PutRolePolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:AttachRolePolicy'
                  - 'iam:DetachRolePolicy'
                  - 'iam:PutRolePermissionsBoundary'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${OrgPrefix}-${Environment}-*'
                Condition:
                  StringEquals:
                    'iam:PermissionsBoundary': !Ref WorkloadBoundary
              - Sid: ManageRolesForThisEnvironment
                Effect: Allow
                Action:
                  - 'iam:GetRole'
                  - 'iam:GetRolePolicy'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListAttachedRolePolicies'
                  - 'iam:TagRole'
                  - 'iam:UntagRole'
                  - 'iam:UpdateRole'
                  - 'iam:UpdateRoleDescription'
                  - 'iam:UpdateAssumeRolePolicy'
                  - 'iam:DeleteRole'
                  - 'iam:PassRole'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${OrgPrefix}-${Environment}-*'

  # Used by pull requests. Can preview change sets, cannot execute them.
  # TagResource and UntagResource: CloudFormation checks them when a change set
  # carries stack tags, which scripts/cfn-change.sh always adds.
  GitHubPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${OrgPrefix}-github-plan-${Environment}'
      Description: Lets pull-request workflows preview CloudFormation change sets.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub '${GitHubSubjectPrefix}:pull_request'
      Policies:
        - PolicyName: preview-change-sets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PreviewChangeSets
                Effect: Allow
                Action:
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:TagResource'
                  - 'cloudformation:UntagResource'
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${OrgPrefix}-${Environment}-*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*'
              - Sid: PassServiceRoleToCloudFormation
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com
              - Sid: UploadPackagedCode
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: !Sub '${ArtifactsBucket.Arn}/*'
              - Sid: CheckPackagedCode
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !GetAtt ArtifactsBucket.Arn

  # Used after merge. Only a job that targets this GitHub Environment can assume it.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${OrgPrefix}-github-deploy-${Environment}'
      Description: Lets approved workflow runs execute CloudFormation change sets.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub '${GitHubSubjectPrefix}:environment:${Environment}'
      Policies:
        - PolicyName: deploy-stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeployStacks
                Effect: Allow
                Action:
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:DescribeStackEvents'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudformation:TagResource'
                  - 'cloudformation:UntagResource'
                  - 'cloudformation:UpdateTerminationProtection'
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${OrgPrefix}-${Environment}-*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*'
              - Sid: PassServiceRoleToCloudFormation
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com
              - Sid: UploadPackagedCode
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource: !Sub '${ArtifactsBucket.Arn}/*'
              - Sid: CheckPackagedCode
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !GetAtt ArtifactsBucket.Arn

Outputs:
  CloudFormationServiceRoleArn:
    Description: Set as the CFN_SERVICE_ROLE_ARN variable on the GitHub Environment.
    Value: !GetAtt CloudFormationServiceRole.Arn
  GitHubDeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable on the GitHub Environment.
    Value: !GetAtt GitHubDeployRole.Arn
  GitHubPlanRoleArn:
    Description: Assumed by pull-request previews. Built by name in the workflow, listed here for reference.
    Value: !GetAtt GitHubPlanRole.Arn
  ArtifactsBucketName:
    Description: Where scripts/cfn-change.sh uploads packaged code. Found by name, listed here for reference.
    Value: !Ref ArtifactsBucket
  WorkloadBoundaryArn:
    Description: The permissions boundary every role created by a stack must carry.
    Value: !Ref WorkloadBoundary