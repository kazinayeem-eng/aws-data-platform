AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pipeline identity for one workload account: the GitHub OIDC provider, a
  CloudFormation service role, and separate plan and deploy roles for GitHub
  Actions. Deployed once per account by a human administrator, never by the
  pipeline itself.

Parameters:
  OrgPrefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,12}$'
    Description: Short lowercase prefix used in every name.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Which environment this account hosts.
  GitHubSubjectPrefix:
    Type: String
    AllowedPattern: '^repo:[A-Za-z0-9-]+@[0-9]+/[A-Za-z0-9._-]+@[0-9]+$'
    Description: >-
      Repository part of the OIDC subject claim, in the form GitHub uses for
      new repositories, for example repo:octocat@1234567/my-repo@987654321.
      Wildcards are rejected.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Assumed by the CloudFormation service only. This role, not the GitHub roles,
  # holds the permission to create resources. Widen it deliberately as you adopt
  # new AWS services.
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${OrgPrefix}-cfn-service-${Environment}'
      Description: Creates the resources defined in pipeline-deployed stacks.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: stack-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BucketsForThisEnvironment
                Effect: Allow
                Action: 's3:*'
                Resource: !Sub 'arn:aws:s3:::${OrgPrefix}-${Environment}-*'

  # Used by pull requests. Can preview change sets, cannot execute them.
  GitHubPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${OrgPrefix}-github-plan-${Environment}'
      Description: Lets pull-request workflows preview CloudFormation change sets.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub '${GitHubSubjectPrefix}:pull_request'
      Policies:
        - PolicyName: preview-change-sets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PreviewChangeSets
                Effect: Allow
                Action:
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:DescribeStacks'
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${OrgPrefix}-${Environment}-*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*'
              - Sid: PassServiceRoleToCloudFormation
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com

  # Used after merge. Only a job that targets this GitHub Environment can assume it.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${OrgPrefix}-github-deploy-${Environment}'
      Description: Lets approved workflow runs execute CloudFormation change sets.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub '${GitHubSubjectPrefix}:environment:${Environment}'
      Policies:
        - PolicyName: deploy-stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeployStacks
                Effect: Allow
                Action:
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:DescribeStackEvents'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudformation:UpdateTerminationProtection'
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${OrgPrefix}-${Environment}-*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*'
              - Sid: PassServiceRoleToCloudFormation
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com

Outputs:
  CloudFormationServiceRoleArn:
    Description: Set as the CFN_SERVICE_ROLE_ARN variable on the GitHub Environment.
    Value: !GetAtt CloudFormationServiceRole.Arn
  GitHubDeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable on the GitHub Environment.
    Value: !GetAtt GitHubDeployRole.Arn
  GitHubPlanRoleArn:
    Description: Assumed by pull-request previews. Built by name in the workflow, listed here for reference.
    Value: !GetAtt GitHubPlanRole.Arn