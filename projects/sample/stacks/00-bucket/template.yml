AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Hardened S3 data bucket: S3-managed encryption, server access logging,
  TLS-only access and lifecycle rules. Deleting the stack deletes both buckets
  once they are empty (decision D13).

Parameters:
  OrgPrefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,12}$'
    Description: Short lowercase prefix used in every resource name.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Environment this stack is deployed to.
  DataClassification:
    Type: String
    AllowedValues: [internal, confidential, restricted]
    Default: confidential
    Description: Sensitivity label recorded as a tag on the bucket.
  AccessLogRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Days to keep server access logs.

Resources:
  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${OrgPrefix}-${Environment}-sample-logs-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # These buckets were created with versioning, which S3 can only suspend,
      # never remove: no new versions are kept (decision D13).
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            ExpirationInDays: !Ref AccessLogRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogBucket.Arn
              - !Sub '${AccessLogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${AccessLogBucket.Arn}/s3-access/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:s3:::${OrgPrefix}-${Environment}-sample-${AWS::AccountId}-${AWS::Region}'

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    DependsOn: AccessLogBucketPolicy
    Properties:
      BucketName: !Sub '${OrgPrefix}-${Environment}-sample-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # These buckets were created with versioning, which S3 can only suspend,
      # never remove: no new versions are kept (decision D13).
      VersioningConfiguration:
        Status: Suspended
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: s3-access/sample/
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: DataClassification
          Value: !Ref DataClassification

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: DenyUploadsWithAnotherEncryptionType
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${DataBucket.Arn}/*'
            Condition:
              'Null':
                's3:x-amz-server-side-encryption': 'false'
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'AES256'

Outputs:
  DataBucketName:
    Description: Name of the data bucket.
    Value: !Ref DataBucket
  DataBucketArn:
    Description: ARN of the data bucket.
    Value: !GetAtt DataBucket.Arn
  AccessLogBucketName:
    Description: Name of the server access log bucket.
    Value: !Ref AccessLogBucket