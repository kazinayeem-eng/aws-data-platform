AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Throw-away probe project that proves a second project deploys on its own.
  Same stack folder name as the sample project, different stack.

Parameters:
  OrgPrefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,12}$'
    Description: Short lowercase prefix used in every resource name.
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Environment this stack is deployed to.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${OrgPrefix}-${Environment}-probe-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketName:
    Description: Name of the probe bucket.
    Value: !Ref Bucket
