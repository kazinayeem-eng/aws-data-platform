<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="You sign in to AWS through IAM Identity Center with MFA and approve prod deploys in GitHub. GitHub Actions signs in to the dev and prod accounts with OIDC and stores no AWS keys. In each account a plan role previews pull requests and a deploy role deploys merges, both through the CloudFormation service role, the only role that creates the project stacks. The management account holds Identity Center, the guardrails, the $5 budget brake and the audit trail."><title>You sign in to AWS through IAM Identity Center with MFA and approve prod deploys in GitHub. GitHub Actions signs in to the dev and prod accounts with OIDC and stores no AWS keys. In each account a plan role previews pull requests and a deploy role deploys merges, both through the CloudFormation service role, the only role that creates the project stacks. The management account holds Identity Center, the guardrails, the $5 budget brake and the audit trail.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#F0F6FC}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.mut{fill:#9198A1}.b{font-weight:700}@media (prefers-reduced-motion:reduce){.motion{display:none}}</style><defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#151B23"/></linearGradient><pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#2A313C"/></pattern><radialGradient id="pfade" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient><mask id="pmask"><rect width="1280" height="760" fill="url(#pfade)"/></mask><radialGradient id="pglow" cx=".5" cy=".28" r=".55"><stop offset="0" stop-color="#FF9900" stop-opacity=".16"/><stop offset="1" stop-color="#FF9900" stop-opacity="0"/></radialGradient><marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198A1"/></marker></defs><rect width="1280" height="760" rx="18" fill="url(#pbg)"/><rect width="1280" height="760" rx="18" fill="url(#pdots)" mask="url(#pmask)"/><rect width="1280" height="760" rx="18" fill="url(#pglow)"/><rect x=".75" y=".75" width="1278.5" height="758.5" rx="17.5" fill="none" stroke="#3D444D" stroke-width="1.5"/><rect x="48" y="24" width="288" height="100" rx="16" fill="#0D1117" stroke="#F0F6FC" stroke-width="2"/><text x="192" y="66" font-size="26" text-anchor="middle" class="b">You</text><text x="192" y="100" font-size="19" text-anchor="middle" class="mut">sign in · approve prod</text><rect x="536" y="24" width="520" height="100" rx="16" fill="#0D1117" stroke="#F0F6FC" stroke-width="2"/><text x="796" y="66" font-size="26" text-anchor="middle" class="b">GitHub Actions</text><text x="796" y="100" font-size="19" text-anchor="middle" fill="#3FB950">signs in with OIDC · stores no AWS keys</text><path d="M336 74 H530" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="434" y="62" font-size="17" text-anchor="middle" class="mut">approves prod</text><rect x="24" y="150" width="1232" height="590" rx="20" fill="none" stroke="#3D444D" stroke-width="2" stroke-dasharray="7 6"/><text x="48" y="182" font-size="16" class="m mut" letter-spacing="1.6">AWS ORGANIZATION</text><rect x="48" y="196" width="288" height="524" rx="14" fill="#151B23" stroke="#3D444D" stroke-width="1.6"/><text x="68" y="234" font-size="23" class="b">management</text><rect x="66" y="252" width="252" height="104" rx="12" fill="#0D2747" stroke="#4493F8" stroke-width="1.8"/><text x="84" y="284" font-size="20" class="b" fill="#4493F8">IAM Identity Center</text><text x="84" y="312" font-size="17" class="mut">MFA, no IAM users or keys</text><text x="84" y="338" font-size="17" class="mut">1 h admin · 4 h read-only</text><rect x="66" y="368" width="252" height="104" rx="12" fill="#2D1214" stroke="#F85149" stroke-width="1.8"/><text x="84" y="400" font-size="20" class="b" fill="#F85149">Guardrails</text><text x="84" y="428" font-size="17" class="mut">service control policies</text><text x="84" y="454" font-size="17" class="mut">on the dev and prod OUs</text><rect x="66" y="484" width="252" height="104" rx="12" fill="#0D1117" stroke="#FFA657" stroke-width="1.8"/><text x="84" y="516" font-size="20" class="b" fill="#FFA657">$5 budget brake</text><text x="84" y="544" font-size="17" class="mut">alerts at 50%, 80%, 100%</text><text x="84" y="570" font-size="17" class="mut">freezes dev and prod at $5</text><rect x="66" y="600" width="252" height="104" rx="12" fill="#0D1117" stroke="#3D444D" stroke-width="1.8"/><text x="84" y="632" font-size="20" class="b" fill="#F0F6FC">Audit</text><text x="84" y="660" font-size="17" class="mut">organization CloudTrail</text><text x="84" y="686" font-size="17" class="mut">IAM Access Analyzer</text><path d="M300 124 V250" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="310" y="145" font-size="17" class="mut">MFA</text><rect x="360" y="196" width="424" height="524" rx="14" fill="#0D2747" stroke="#4493F8" stroke-width="2"/><text x="384" y="236" font-size="24" class="b" fill="#4493F8">dev account</text><text x="760" y="236" font-size="16" text-anchor="end" fill="#F85149">guardrails apply</text><rect x="382" y="262" width="380" height="128" rx="10" fill="#0D1117" stroke="#3D444D" stroke-width="1.6"/><text x="402" y="294" font-size="20" class="b">plan role</text><text x="402" y="318" font-size="17" class="mut">previews pull requests</text><line x1="402" y1="332" x2="742" y2="332" stroke="#3D444D" stroke-width="1.4"/><text x="402" y="360" font-size="20" class="b">deploy role</text><text x="402" y="384" font-size="17" class="mut">deploys every merge</text><path d="M572 390 V428" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="584" y="414" font-size="16" class="mut">both use</text><rect x="382" y="434" width="380" height="80" rx="10" fill="#0D1117" stroke="#AB7DF8" stroke-width="2"/><text x="572" y="466" font-size="20" text-anchor="middle" class="b" fill="#AB7DF8">CloudFormation service role</text><text x="572" y="494" font-size="17" text-anchor="middle" class="mut">the only role that creates resources</text><path d="M572 514 V552" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="584" y="538" font-size="16" class="mut">creates</text><rect x="398" y="572" width="360" height="76" rx="10" fill="#0D1117" stroke="#4493F8" stroke-width="1.6"/><rect x="390" y="565" width="360" height="76" rx="10" fill="#0D1117" stroke="#4493F8" stroke-width="1.6"/><rect x="382" y="558" width="360" height="76" rx="10" fill="#0D1117" stroke="#4493F8" stroke-width="1.6"/><text x="402" y="590" font-size="20" class="b">project stacks</text><text x="402" y="616" font-size="16" class="m mut">&lt;org&gt;-dev-&lt;project&gt;-&lt;name&gt;</text><rect x="382" y="666" width="164" height="36" rx="18" fill="#0D1117" stroke="#3D444D" stroke-width="1.4"/><text x="464.0" y="690" font-size="16" text-anchor="middle">artifacts bucket</text><rect x="558" y="666" width="204" height="36" rx="18" fill="#0D1117" stroke="#3D444D" stroke-width="1.4"/><text x="660.0" y="690" font-size="16" text-anchor="middle">permissions boundary</text><rect x="808" y="196" width="424" height="524" rx="14" fill="#0F2A1A" stroke="#3FB950" stroke-width="2"/><text x="832" y="236" font-size="24" class="b" fill="#3FB950">prod account</text><text x="1208" y="236" font-size="16" text-anchor="end" fill="#F85149">guardrails apply</text><rect x="830" y="262" width="380" height="128" rx="10" fill="#0D1117" stroke="#3D444D" stroke-width="1.6"/><text x="850" y="294" font-size="20" class="b">plan role</text><text x="850" y="318" font-size="17" class="mut">previews pull requests</text><line x1="850" y1="332" x2="1190" y2="332" stroke="#3D444D" stroke-width="1.4"/><text x="850" y="360" font-size="20" class="b">deploy role</text><text x="850" y="384" font-size="17" class="mut">deploys once you approve</text><path d="M1020 390 V428" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="1032" y="414" font-size="16" class="mut">both use</text><rect x="830" y="434" width="380" height="80" rx="10" fill="#0D1117" stroke="#AB7DF8" stroke-width="2"/><text x="1020" y="466" font-size="20" text-anchor="middle" class="b" fill="#AB7DF8">CloudFormation service role</text><text x="1020" y="494" font-size="17" text-anchor="middle" class="mut">the only role that creates resources</text><path d="M1020 514 V552" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="1032" y="538" font-size="16" class="mut">creates</text><rect x="846" y="572" width="360" height="76" rx="10" fill="#0D1117" stroke="#3FB950" stroke-width="1.6"/><rect x="838" y="565" width="360" height="76" rx="10" fill="#0D1117" stroke="#3FB950" stroke-width="1.6"/><rect x="830" y="558" width="360" height="76" rx="10" fill="#0D1117" stroke="#3FB950" stroke-width="1.6"/><text x="850" y="590" font-size="20" class="b">project stacks</text><text x="850" y="616" font-size="16" class="m mut">&lt;org&gt;-prod-&lt;project&gt;-&lt;name&gt;</text><rect x="830" y="666" width="164" height="36" rx="18" fill="#0D1117" stroke="#3D444D" stroke-width="1.4"/><text x="912.0" y="690" font-size="16" text-anchor="middle">artifacts bucket</text><rect x="1006" y="666" width="204" height="36" rx="18" fill="#0D1117" stroke="#3D444D" stroke-width="1.4"/><text x="1108.0" y="690" font-size="16" text-anchor="middle">permissions boundary</text><path d="M572 124 V256" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="582" y="145" font-size="17" fill="#3FB950">OIDC</text><path d="M1020 124 V256" fill="none" stroke="#9198A1" stroke-width="2" marker-end="url(#parr)"/><text x="1030" y="145" font-size="17" fill="#3FB950">OIDC</text></svg>