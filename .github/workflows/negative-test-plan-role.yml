name: Negative test - plan role cannot create buckets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: Probe dev plan role
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::456015013426:role/kazi-github-plan-dev
          role-session-name: negative-test-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Show who we are
        run: aws sts get-caller-identity

      - name: Try to create a bucket (must be denied)
        run: aws s3api create-bucket --bucket kazi-dev-probe-456015013426 --region ap-southeast-2 --create-bucket-configuration LocationConstraint=ap-southeast-2