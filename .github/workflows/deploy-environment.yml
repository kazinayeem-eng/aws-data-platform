name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (dev or prod)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy stacks
        env:
          ORG_PREFIX: ${{ vars.ORG_PREFIX }}
          ENVIRONMENT: ${{ inputs.environment }}
          CFN_ROLE_ARN: ${{ vars.CFN_SERVICE_ROLE_ARN }}
        run: |
          shopt -s nullglob
          for dir in stacks/*/; do
            ./scripts/cfn-change.sh apply "$dir" "$ENVIRONMENT"
          done
