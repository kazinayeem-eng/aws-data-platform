name: PR validate and preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and policy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.13'

      - name: Install the locked Python tools
        run: uv sync --locked

      - name: Install actionlint and cfn-guard (pinned and checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -sSfLo cfn-guard.tgz https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.4.0/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz
          sha256sum -c <<'EOF'
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz
          2abb404dfc4cd2d58fedbcc85231daaf85f33ab7d255ce329776e8a3080cf1c9  cfn-guard.tgz
          EOF
          tar -xzf actionlint.tgz -C bin actionlint
          tar -xzf cfn-guard.tgz -C bin --strip-components=1 cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint CloudFormation templates
        run: |
          files="$(git ls-files ':(glob)bootstrap/**/*.yml' ':(glob)projects/*/stacks/*/template.yml')"
          # shellcheck disable=SC2086
          uv run cfn-lint $files

      - name: Check templates against the Guard rules
        run: |
          for file in $(git ls-files ':(glob)bootstrap/**/*.yml' ':(glob)projects/*/stacks/*/template.yml'); do
            cfn-guard validate --rules guard/ --data "$file" --show-summary fail
          done

      - name: Check the workflows
        run: |
          actionlint
          uv run zizmor --offline --min-severity medium .github/workflows/

      - name: Check and test the pipeline scripts
        run: |
          shellcheck scripts/*.sh tests/*.sh
          bash tests/pipeline-test.sh

  preview:
    name: Preview ${{ matrix.environment }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            account_id: ${{ vars.DEV_ACCOUNT_ID }}
          - environment: prod
            account_id: ${{ vars.PROD_ACCOUNT_ID }}
    steps:
      - name: Check out the code (full history, to compare with main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print the token subject (diagnostic)
        run: |
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
          python3 -c '
          import base64, json, sys
          payload = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("sub", "aud", "repository", "repository_id", "ref"):
              print(key + ": " + str(claims.get(key)))
          '

      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/${{ vars.ORG_PREFIX }}-github-plan-${{ matrix.environment }}
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ matrix.account_id }}

      - name: Preview change sets
        env:
          ORG_PREFIX: ${{ vars.ORG_PREFIX }}
          ENVIRONMENT: ${{ matrix.environment }}
          CFN_ROLE_ARN: arn:aws:iam::${{ matrix.account_id }}:role/${{ vars.ORG_PREFIX }}-cfn-service-${{ matrix.environment }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          projects="$(./scripts/changed-projects.sh "$BASE_REF")"
          if [ -z "$projects" ]; then
            echo "No project changes to preview." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for project in $projects; do
            ./scripts/cfn-project.sh preview "$project" "$ENVIRONMENT"
          done